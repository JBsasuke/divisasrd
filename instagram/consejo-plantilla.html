<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Divisas RD · Consejo de la tarde</title>
<style>
  @font-face { font-family: "Inter RD"; font-weight: 500; src: url("fuentes/Inter-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Inter RD"; font-weight: 600; src: url("fuentes/Inter-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "Inter RD"; font-weight: 700; src: url("fuentes/Inter-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Inter RD"; font-weight: 800; src: url("fuentes/Inter-ExtraBold.woff2") format("woff2"); }
  @font-face { font-family: "Inter RD"; font-weight: 900; src: url("fuentes/Inter-Black.woff2") format("woff2"); }
  :root {
    --noche: #061428; --bandera: #002d62; --claro: #0b4a8f;
    --dorado: #ffc107; --dorado2: #ffe082; --blanco: #fff; --suave: #b8c7e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; overflow: hidden; }
  body {
    height: 1350px;
    font-family: "Inter RD", "Inter", system-ui, sans-serif; color: var(--blanco);
    background: radial-gradient(1100px 700px at 85% -10%, rgba(255,193,7,.16), transparent 60%),
                radial-gradient(900px 700px at 0% 110%, rgba(255,193,7,.08), transparent 60%),
                linear-gradient(170deg, var(--noche) 0%, var(--bandera) 58%, var(--claro) 100%);
    padding: 64px 64px 52px; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  /* Historia: deja espacio arriba y abajo para el nombre y la barra de respuesta de Instagram */
  body.historia { height: 1920px; padding: 250px 64px 300px; }

  .cab { display: flex; align-items: center; gap: 22px; }
  .logo {
    width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: linear-gradient(#ffd54f, var(--dorado) 50%, #e0a000);
    border: 3px solid rgba(255,255,255,.75); box-shadow: 0 0 34px rgba(255,193,7,.45);
    font-weight: 900; font-size: 54px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.18);
  }
  .marca b { display: block; font-size: 50px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .marca span { display: block; margin-top: 8px; font-size: 24px; color: var(--dorado); font-weight: 600; }
  .fecha { margin-left: auto; text-align: right; font-size: 24px; color: var(--suave); font-weight: 600; line-height: 1.35; }
  .fecha b { display: block; font-size: 30px; color: var(--blanco); font-weight: 700; }

  .cuerpo { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 34px 0; }
  .tarjeta {
    padding: 56px 56px 60px; border-radius: 40px; border: 3px solid transparent;
    background:
      linear-gradient(180deg, rgba(255,193,7,.14), rgba(255,255,255,.03)) padding-box,
      linear-gradient(#082246, #082246) padding-box,
      linear-gradient(135deg, var(--dorado2), var(--dorado), #e0a000) border-box;
    box-shadow: 0 18px 60px rgba(255,193,7,.16);
  }
  .etiqueta { display: inline-flex; align-items: center; gap: 14px; padding: 12px 24px; border-radius: 999px;
    font-size: 24px; font-weight: 800; letter-spacing: .12em;
    background: rgba(255,193,7,.14); color: var(--dorado); border: 2px solid rgba(255,193,7,.5); }
  .etiqueta i { width: 14px; height: 14px; border-radius: 50%; background: var(--dorado); box-shadow: 0 0 12px var(--dorado); }
  h1 { margin-top: 34px; font-size: 72px; line-height: 1.06; font-weight: 900; letter-spacing: -0.03em; }
  h1.mediano { font-size: 62px; }
  .texto { margin-top: 28px; font-size: 38px; line-height: 1.42; color: var(--suave); font-weight: 500; }

  .comillas { font-size: 210px; line-height: .6; height: 96px; margin-top: 44px; color: var(--dorado); font-weight: 900; }
  .cita { font-size: 62px; line-height: 1.22; font-weight: 800; letter-spacing: -0.02em; }
  .cita.larga { font-size: 54px; }

  .pie { display: flex; align-items: center; gap: 20px; padding-top: 24px; border-top: 2px solid rgba(255,193,7,.25); }
  .pie .web { font-size: 34px; font-weight: 800; color: var(--dorado); }
  .pie .web small { display: block; font-size: 21px; font-weight: 500; color: var(--suave); margin-top: 4px; }
  .pie .redes { margin-left: auto; text-align: right; font-size: 22px; color: var(--suave); line-height: 1.45; font-weight: 600; }
</style>
</head>
<body>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

window.pintar = function (tipo, d, formato) {
  if (formato === "historia") document.body.classList.add("historia");
  const cab = `<div class="cab">
      <div class="logo">$</div>
      <div class="marca"><b>Divisas RD</b><span>Consejos para tu dinero</span></div>
      <div class="fecha"><b>${esc(d.dia)}</b>${esc(d.fecha)}</div>
    </div>`;
  let centro;
  if (tipo === "frase") {
    centro = `<div class="tarjeta">
        <span class="etiqueta"><i></i>${esc(d.etiqueta)}</span>
        <div class="comillas">“</div>
        <div class="cita ${d.texto.length > 90 ? "larga" : ""}">${esc(d.texto)}</div>
      </div>`;
  } else {
    centro = `<div class="tarjeta">
        <span class="etiqueta"><i></i>${esc(d.etiqueta)}</span>
        <h1 class="${d.titulo.length > 30 ? "mediano" : ""}">${esc(d.titulo)}</h1>
        <p class="texto">${esc(d.texto)}</p>
      </div>`;
  }
  const pie = `<div class="pie">
      <div class="web">divisasrd.com<small>La tasa del dólar de hoy, banco por banco</small></div>
      <div class="redes">@divisas_rd<br>en Instagram y X</div>
    </div>`;
  document.body.innerHTML = cab + `<div class="cuerpo">${centro}</div>` + pie;
};
</script>
</body>
</html>
