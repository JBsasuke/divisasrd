# =====================================================================
#  Divisas RD - Publica en Instagram (@divisas_rd) automáticamente
#   - Todos los días ~8:13 a. m. (hora de RD): tasa del dólar. Respaldo a las 9:43 a. m.
#   - Todos los días ~3:07 p. m.: consejo de la tarde (cambio, remesas, ahorro, dólares o frase).
#     Respaldo a las 4:37 p. m.
#   - Viernes ~7:07 p. m. y, si el MICM se atrasó, sábado 8:11 a. m.: combustibles
#  RD está siempre en UTC-4 (no cambia la hora), por eso los horarios en UTC son fijos.
#  GitHub a veces atrasa o se salta los horarios (sobre todo a la hora en punto):
#  por eso se usan minutos "raros" y un segundo intento que solo publica si el
#  primero no salió (ig/publicado-tasa.txt guarda el último día publicado).
#  Además, el worker de Cloudflare (divisas-rd) arranca este trabajo a las mismas horas
#  con publicar=auto: si GitHub se salta el horario, igual sale; si no, no se repite.
# =====================================================================
name: Instagram

on:
  schedule:
    - cron: "13 12 * * *"   # 8:13 a. m. RD, todos los días   -> tasa
    - cron: "43 13 * * *"   # 9:43 a. m. RD (respaldo)        -> tasa, solo si no salió a las 8
    - cron: "7 19 * * *"    # 3:07 p. m. RD, todos los días   -> consejo de la tarde
    - cron: "37 20 * * *"   # 4:37 p. m. RD (respaldo)        -> consejo, solo si no salió a las 3
    - cron: "7 23 * * 5"    # 7:07 p. m. RD, viernes           -> combustibles
    - cron: "11 12 * * 6"   # 8:11 a. m. RD, sábado (respaldo) -> combustibles, solo si no salió el viernes
  workflow_dispatch:
    inputs:
      modo:
        description: "¿Qué imagen?"
        type: choice
        options: [tasa, consejo, combustibles]
        default: tasa
      publicar:
        description: "¿Publicar en Instagram? (no = solo crear la imagen · auto = como el horario: no repite si ya salió hoy)"
        type: choice
        options: ["no", "si", "auto"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decidir qué se publica
        id: plan
        run: |
          # "auto" = lo manda el worker de Cloudflare a la hora del horario (por si GitHub se lo salta)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publicar }}" = "auto" ]; then
            echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT"
            HOY=$(TZ=America/Santo_Domingo date +%F)
            MARCA="ig/publicado-${{ inputs.modo }}.txt"   # tasa o consejo (combustibles se revisa por semana)
            if [ "${{ inputs.modo }}" != "combustibles" ] && [ "$(cat $MARCA 2>/dev/null)" = "$HOY" ]; then
              echo "Hoy ya se publicó ($MARCA)"; echo "publicar=ya" >> "$GITHUB_OUTPUT"
            else
              echo "publicar=si" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT"
            echo "publicar=${{ inputs.publicar }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "13 12 * * *" ] || [ "${{ github.event.schedule }}" = "43 13 * * *" ]; then
            echo "modo=tasa" >> "$GITHUB_OUTPUT"
            # Si la tasa de hoy ya salió (el respaldo llega tarde), no se repite
            HOY=$(TZ=America/Santo_Domingo date +%F)
            if [ "$(cat ig/publicado-tasa.txt 2>/dev/null)" = "$HOY" ]; then
              echo "La tasa de hoy ya se publicó"; echo "publicar=ya" >> "$GITHUB_OUTPUT"
            else
              echo "publicar=si" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.schedule }}" = "7 19 * * *" ] || [ "${{ github.event.schedule }}" = "37 20 * * *" ]; then
            echo "modo=consejo" >> "$GITHUB_OUTPUT"
            HOY=$(TZ=America/Santo_Domingo date +%F)
            if [ "$(cat ig/publicado-consejo.txt 2>/dev/null)" = "$HOY" ]; then
              echo "El consejo de hoy ya se publicó"; echo "publicar=ya" >> "$GITHUB_OUTPUT"
            else
              echo "publicar=si" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "modo=combustibles" >> "$GITHUB_OUTPUT"
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.publicar != 'ya'
        with:
          node-version: 20

      # Usa el Google Chrome que ya trae GitHub y la letra incluida en instagram/fuentes:
      # no se descarga ningún navegador ni se instala nada del sistema
      - name: Preparar
        if: steps.plan.outputs.publicar != 'ya'
        working-directory: instagram
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund

      - name: Crear la imagen
        id: imagen
        if: steps.plan.outputs.publicar != 'ya'
        run: |
          if [ "${{ steps.plan.outputs.modo }}" = "consejo" ]; then
            node instagram/consejo-generar.mjs
          else
            node instagram/generar.mjs ${{ steps.plan.outputs.modo }}
          fi

      - name: Subir la imagen a divisasrd.com
        if: steps.plan.outputs.publicar != 'ya' && steps.imagen.outputs.saltar != 'true'
        run: |
          # Deja solo las imágenes de los últimos 7 días (la fecha va en el nombre del archivo)
          LIMITE=$(date -u -d '7 days ago' +%F)
          for f in ig/*-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]*; do
            [ -e "$f" ] || continue
            FECHA=$(echo "$f" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}')
            if [[ "$FECHA" < "$LIMITE" ]]; then rm -f "$f"; fi
          done
          git config user.name "divisasrd-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ig
          git commit -m "Instagram: ${{ steps.imagen.outputs.archivo }}" || echo "Sin cambios"
          git pull --rebase
          git push

      - name: Esperar a que la imagen esté en línea
        if: steps.imagen.outputs.saltar != 'true' && steps.plan.outputs.publicar == 'si'
        run: |
          URL="https://divisasrd.com/ig/${{ steps.imagen.outputs.archivo }}"
          for i in $(seq 1 30); do
            if curl -sfI "$URL" | grep -qi '^content-type: image/jpeg'; then
              echo "La imagen ya está en línea: $URL"; exit 0
            fi
            sleep 10
          done
          echo "La imagen no apareció en divisasrd.com después de 5 minutos"; exit 1

      - name: Publicar en Instagram
        if: steps.imagen.outputs.saltar != 'true' && steps.plan.outputs.publicar == 'si'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARCHIVO="${{ steps.imagen.outputs.archivo }}"
          node instagram/publicar.mjs "https://divisasrd.com/ig/$ARCHIVO" "ig/${ARCHIVO%.jpg}.txt"

      # Si la historia falla, no se marca error: la publicación del perfil ya salió
      - name: Publicar también en la historia
        if: steps.imagen.outputs.saltar != 'true' && steps.plan.outputs.publicar == 'si'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          node instagram/publicar.mjs --historia "https://divisasrd.com/ig/${{ steps.imagen.outputs.historia }}?v=${{ github.run_id }}"

      - name: Marcar la tasa de hoy como publicada
        if: steps.imagen.outputs.saltar != 'true' && steps.plan.outputs.publicar == 'si' && steps.plan.outputs.modo == 'tasa'
        run: |
          TZ=America/Santo_Domingo date +%F > ig/publicado-tasa.txt
          git add ig/publicado-tasa.txt
          git commit -m "Instagram: tasa publicada" || true
          git pull --rebase
          git push

      - name: Marcar el consejo de hoy como publicado
        if: steps.imagen.outputs.saltar != 'true' && steps.plan.outputs.publicar == 'si' && steps.plan.outputs.modo == 'consejo'
        run: |
          TZ=America/Santo_Domingo date +%F > ig/publicado-consejo.txt
          git add ig/publicado-consejo.txt
          git commit -m "Instagram: consejo publicado" || true
          git pull --rebase
          git push

      - name: Marcar la semana de combustibles como publicada
        if: steps.imagen.outputs.saltar != 'true' && steps.plan.outputs.publicar == 'si' && steps.plan.outputs.modo == 'combustibles'
        run: |
          echo "${{ steps.imagen.outputs.semana }}" > ig/ultima-semana.txt
          git add ig/ultima-semana.txt
          git commit -m "Instagram: combustibles publicados (${{ steps.imagen.outputs.semana }})" || true
          git pull --rebase
          git push

      # El token de Instagram dura 60 días. Cada lunes se renueva y se guarda solo,
      # si existe el secret GH_PAT (token de GitHub con permiso para editar secrets).
      - name: Renovar el token de Instagram (lunes)
        if: (github.event_name == 'schedule' || inputs.publicar == 'auto') && steps.plan.outputs.modo == 'tasa' && steps.plan.outputs.publicar == 'si'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "$(date -u +%u)" != "1" ]; then echo "Hoy no toca renovar"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Falta el secret GH_PAT: el token de Instagram no se renueva solo"; exit 0; fi
          node instagram/renovar-token.mjs "$RUNNER_TEMP/ig_token"
          gh secret set IG_TOKEN --repo "${{ github.repository }}" < "$RUNNER_TEMP/ig_token"
          rm -f "$RUNNER_TEMP/ig_token"
          echo "IG_TOKEN actualizado"
