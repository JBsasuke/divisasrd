# Divisas RD - datos de cada país (economía, combustibles, gasolina por estado e historial del dólar) una vez al día
name: Paises
on:
  schedule:
    - cron: "23 15 * * *"   # 11:23 a. m. hora de RD (a esa hora los bancos ya pusieron la tasa del día)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram          # el mismo grupo que Instagram, para que no choquen al guardar
  cancel-in-progress: false
jobs:
  paises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar los datos de cada país
        run: |
          pip install --quiet xlrd   # para leer el Excel de la gasolina de la EIA
          python paises.py
      - name: Guardar paises.json
        run: |
          git config user.name "divisasrd-bot"
          git config user.email "bot@divisasrd.com"
          git add paises.json
          git commit -m "Datos de países $(date -u +%F)" || echo "sin cambios"
          # GitHub a veces rechaza la subida por un fallo suyo: se intenta hasta 3 veces
          for i in 1 2 3; do
            git pull --rebase && git push && break
            if [ "$i" = "3" ]; then echo "::error::GitHub no aceptó la subida después de 3 intentos"; exit 1; fi
            echo "GitHub rechazó la subida, se intenta otra vez en 15 segundos ($i)"; sleep 15
          done
